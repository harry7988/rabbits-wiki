<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="兔子腹部按摩位置示意图">
  <style>
    .body  { fill:#232325; stroke:#7ec96a; stroke-width:3; }
    .organ { fill:#5a4425; stroke:#d9a45c; stroke-width:1.5; opacity:0.55; }
    .zone  { fill:#7ec96a; opacity:0.18; stroke:#7ec96a; stroke-width:2; stroke-dasharray:6 4; }
    .forbid{ fill:#ff6b5b; opacity:0.12; stroke:#c0392b; stroke-width:2; stroke-dasharray:6 4; }
    .hand  { fill:none; stroke:#e8ecdf; stroke-width:2.5; stroke-linecap:round; }
    .lbl   { font:600 15px -apple-system,'PingFang SC',sans-serif; fill:#e8ecdf; }
    .lbl-s { font:600 12.5px -apple-system,'PingFang SC',sans-serif; fill:#a8b4a0; }
    .warn  { font:600 13px -apple-system,'PingFang SC',sans-serif; fill:#ff6b5b; }
    .ok    { font:600 13px -apple-system,'PingFang SC',sans-serif; fill:#7ec96a; }
    .lead  { stroke:#5a7052; stroke-width:1.2; fill:none; }
    .arrow { fill:none; stroke:#7ec96a; stroke-width:2.5; marker-end:url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57933F"/>
    </marker>
  </defs>

  <!-- 兔趴姿（头朝左） -->
  <path class="body" d="M84,236
    C80,196 96,162 134,150
    C142,116 162,96 180,102
    C192,107 197,122 194,140
    C226,128 268,126 310,134
    C380,148 440,172 490,204
    C540,236 574,268 578,300
    C580,326 560,340 530,342
    L470,344
    C400,352 320,354 256,348
    C186,340 122,312 90,278
    C76,260 82,246 84,236 Z"/>
  <!-- 耳（贴背） -->
  <path class="body" d="M162,152 C150,120 154,90 170,78 C182,88 186,120 180,148 Z"/>
  <path class="body" d="M192,142 C196,108 208,82 224,74 C232,88 228,122 214,148 Z"/>
  <circle cx="136" cy="196" r="5" fill="#2a3a24"/>
  <!-- 后腿轮廓 -->
  <ellipse class="body" cx="470" cy="308" rx="70" ry="40"/>

  <!-- 体内脏器示意（腹侧） -->
  <ellipse class="organ" cx="330" cy="300" rx="90" ry="34"/>

  <!-- 按摩区（肋骨后 → 骨盆前 的下腹） -->
  <path class="zone" d="M258,272 C300,258 380,258 428,272
    C436,292 432,316 414,330
    C370,340 300,340 268,328
    C252,314 250,290 258,272 Z"/>

  <!-- 手位示意（俯视双手在腹两侧交替） -->
  <path class="hand" d="M232,286 C220,296 222,314 236,320"/>
  <path class="hand" d="M452,286 C464,296 462,314 448,320"/>
  <path class="arrow" d="M262,300 L418,300"/>

  <!-- 标注 -->
  <line class="lead" x1="200" y1="262" x2="178" y2="226"/>
  <text class="lbl" x="96" y="210">肋骨后缘</text>
  <text class="lbl-s" x="96" y="226">按摩区上界</text>

  <line class="lead" x1="470" y1="262" x2="498" y2="226"/>
  <text class="lbl" x="452" y="210">骨盆前</text>
  <text class="lbl-s" x="452" y="226">按摩区下界</text>

  <text class="ok" x="288" y="382">✅ 按摩区：肋骨后与骨盆之间的下腹部</text>
  <text class="lbl-s" x="288" y="400">手法：双手在腹两侧交替轻揉，或整体缓慢推移（能听到气体移动的咕噜声 = 有效）</text>

  <!-- 禁区：胸廓 -->
  <path class="forbid" d="M150,246 C170,236 200,234 224,242
    C230,258 226,276 212,286
    C190,290 166,284 152,270
    C146,260 146,252 150,246 Z"/>
  <text class="warn" x="60" y="330">❌ 胸廓区不要按</text>

  <text class="lbl-s" x="60" y="396">⚠️ 全腹坚硬如鼓（疑似梗阻）时整个腹部都禁止按摩——立即就医</text>
  <text class="lbl-s" x="60" y="414">rabbits.wiki 原创示意图 · 依据 Mary Cotter (rabbit.org) 手法描述绘制</text>
</svg>
